spring:
  application:
    name: transaction-service
    instance_id: instance-1
  main:
    web-application-type: none

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
#      data-locations: classpath:db/data.sql
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: ${spring.application.name}-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
#      properties:
#        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        acks: all
        retries: 3
#        batch-size: 16384
#        buffer-memory: 33554432
#        compression-type: snappy
      topic:
        transaction.initiated: transaction.initiated.v1
        account.balance.updated: account.balance.updated.v1
        account.balance.failed: account.balance.failed.v1
        fraud.transaction.detected: fraud.transaction.detected.v1
        fraud.transaction.verified: fraud.transaction.verified.v1
    listener:
#      type: single
      ack-mode: manual
#      concurrency: 3
#      poll-timeout: 5000
#      idle-between-polls: 5000

# Enable gRPC server
grpc:
  server:
    port: 9093
    address: 0.0.0.0

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8762/eureka/
    register-with-eureka: true
    fetch-registry: true
    enabled: true
    lease-renewal-interval-in-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

logging:
  level:
    org.springframework: INFO
    com.example: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.kafka: INFO
